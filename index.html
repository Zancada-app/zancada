}
async function api(path){
  const call=async tok=>{
    try{return await fetch(base()+STRAVA_API+path,{headers:{Authorization:'Bearer '+tok}});}
    catch(e){throw new Error('Sin conexión con Strava. Comprueba internet o el proxy.');}
  };
  let r=await call(await accessToken());
  if(r.status===401) r=await call(await accessToken(true));
  if(r.status===429) throw new Error('Strava limita las consultas: vuelve a sincronizar dentro de 15 minutos.');
  if(r.status===401){sv().tokens=null;save();throw new Error('Strava ha retirado el permiso. Vuelve a conectar desde Perfil.');}
  if(!r.ok) throw new Error('Strava respondió con el error '+r.status+'.');
  return r.json();
}
function toRun(a){
  return {id:a.id,date:String(a.start_date_local).slice(0,10),name:String(a.name||'').slice(0,80),km:(a.distance||0)/1000,sec:a.moving_time||a.elapsed_time||0,
    hr:a.average_heartrate||null,hrMax:a.max_heartrate||null,elev:Math.round(a.total_elevation_gain||0),rpe:a.perceived_exertion||null,
    race:a.workout_type===1,type:a.sport_type||a.type,detail:false,be:[],laps:[],splits:[],sessionId:null,extra:false};
}
function addDetail(r,a){
  r.detail=true;
  if(a.perceived_exertion) r.rpe=a.perceived_exertion;
  r.be=(a.best_efforts||[]).map(b=>({n:b.name,d:b.distance,t:b.moving_time||b.elapsed_time})).filter(b=>b.t>0);
  const lp=l=>({km:(l.distance||0)/1000,sec:l.moving_time||l.elapsed_time||0,hr:l.average_heartrate||null,
    gap:l.average_grade_adjusted_speed>0?1000/l.average_grade_adjusted_speed:null,el:l.elevation_difference!=null?l.elevation_difference:(l.total_elevation_gain!=null?l.total_elevation_gain:null)});
  r.laps=(a.laps||[]).map(lp).filter(l=>l.km>0);
  r.splits=(a.splits_metric||[]).map(lp).filter(l=>l.km>0);
  // ritmo ajustado por pendiente (GAP de Strava); si no viene, se estima con el desnivel
  const gs=r.splits.filter(x=>x.gap);
  r.gap=gs.length>=Math.max(1,r.splits.length*0.6)?gs.reduce((t,x)=>t+x.gap*x.km,0)/gs.reduce((t,x)=>t+x.km,0):gapFromElev(r.sec,r.km,r.elev);
}
let syncing=false;
async function stravaSync(){
  const s=sv();
  if(!s.tokens||syncing) return null;
  syncing=true;setSyncUI('Sincronizando con Strava…');
  try{
    const after=Math.floor(s.lastSync?s.lastSync/1000-4*86400:Date.now()/1000-365*86400);
    let list=[];
    for(let page=1;page<=5;page++){
      const arr=await api(`/athlete/activities?after=${after}&per_page=100&page=${page}`);
      list=list.concat(arr);
      if(arr.length<100) break;
    }
    const known=new Map(s.runs.map(r=>[r.id,r]));
    let added=0;
    list.filter(a=>RUN_TYPES.includes(a.sport_type||a.type)&&a.distance>300).forEach(a=>{
      const ex=known.get(a.id);
      if(ex){ex.name=String(a.name||'').slice(0,80);if(a.perceived_exertion)ex.rpe=a.perceived_exertion;}
      else{s.runs.push(toRun(a));added++;}
    });
    s.runs.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
    // detalle: las 30 más recientes y las más rápidas (candidatas a mejor marca)
    const recent=s.runs.filter(r=>!r.detail).slice(-30);
    const fastest=s.runs.filter(r=>!r.detail&&r.km>=4.8&&!recent.includes(r)).sort((a,b)=>a.sec/a.km-b.sec/b.km).slice(0,15);
    const need=recent.reverse().concat(fastest);
    for(const r of need){
      try{addDetail(r,await api(`/activities/${r.id}`));}
      catch(e){if(/limita/.test(e.message))break;}
    }
    if(!s.zonesAt||Date.now()-s.zonesAt>7*864e5){
      try{const z=await api('/athlete/zones');const hz=z&&z.heart_rate;if(hz&&hz.custom_zones&&Array.isArray(hz.zones)&&hz.zones.length===5)s.hrZones=hz.zones.map(x=>({min:x.min,max:x.max}));else s.hrZones=null;s.zonesAt=Date.now();}catch(e){}
    }
    const mx=robustMax(s.runs.map(r=>r.hrMax||0));
    if(mx) s.hrMax=mx;
    s.lastSync=Date.now();
    const res=afterSync();
    save();
    return Object.assign({added},res);
  }finally{syncing=false;setSyncUI();}
}
function setSyncUI(msg){const el=document.getElementById('syncline');if(el)el.textContent=msg||syncLine();if(typeof setBusy==='function')setBusy(!!msg);}
function syncLine(){
  const s=sv();
  if(!s.lastSync) return 'Strava conectado. Aún no se ha sincronizado.';
  const m=Math.round((Date.now()-s.lastSync)/60000);
  return `Strava · sincronizado ${m<1?'ahora mismo':m<60?`hace ${m} min`:m<1440?`hace ${Math.round(m/60)} h`:`hace ${Math.round(m/1440)} días`}`;
}

/* ---------- análisis de cada carrera ---------- */
const hrMaxNow=()=>{const pr=state.profile||{},s=state.strava||{},H=state.hrm||{};return pr.hrMax||s.hrMaxUser||H.max||s.hrMax||(pr.age?Math.round(208-0.7*pr.age):null);};
function rpeFromHR(hr){
  if(!hr) return null;
  if(state.hrm&&state.hrm.lthr){const f=hr/state.hrm.lthr;return f<0.81?3:f<0.85?4:f<0.89?5:f<0.93?6:f<0.97?7:f<1.0?8:9;}
  const hm=hrMaxNow();if(!hm) return null;
  const f=hr/hm;
  return f<0.70?3:f<0.77?4:f<0.82?5:f<0.87?6:f<0.90?7:f<0.93?8:9;
}
function workPaceOf(r){
  const segs=r.laps.length>=3?r.laps:r.splits;
  if(!segs.length||!r.km) return null;
  const avg=r.sec/r.km;
  const fast=segs.filter(l=>l.km>=0.15&&l.sec/l.km<avg*0.95);
  if(!fast.length) return null;
  const km=fast.reduce((a,l)=>a+l.km,0),sec=fast.reduce((a,l)=>a+l.sec,0);
  return km>=0.6?sec/km:null;
}
function runLog(r,x){
  const d=describe(x);
  const hrR=rpeFromHR(r.hr);
  const log={km:Math.round(r.km*100)/100,time:r.sec,hr:r.hr,strava:r.id,elev:r.elev,gap:r.gap||null,
    rpe:r.rpe||hrR||d.rpe,rpeSrc:r.rpe?'strava':hrR?'fc':'previsto',needsFeel:!r.rpe,
    workPace:QUALITY.includes(x.type)?workPaceOf(r):null};
  if(x.type==='test'){
    // el test son los 5 km cronometrados, no la sesión entera con calentamiento
    const b=r.be.find(b=>Math.abs(b.d-5000)<60);
    if(b){log.km=5;log.time=b.t;}
    else{const segs=(r.laps.length>=3?r.laps:r.splits),avg=r.sec/r.km,fast=segs.filter(l=>l.sec/l.km<avg*0.97),fk2=fast.reduce((a,l)=>a+l.km,0);
      if(fk2>=4.5){log.km=5;log.time=Math.round(fast.reduce((a,l)=>a+l.sec,0)/fk2*5);}else log.noTest=true;}
  }
  return log;
}
function afterSync(){
  const s=sv();let matched=0;const names=[];
  if(state.plan){
    const td=today();
    const open=x=>x.status==='pending'||(x.status==='skipped'&&x.auto);
    s.runs.filter(r=>!r.sessionId&&!r.extra&&r.date>=state.plan.created&&r.date<=td).forEach(r=>{
      const manual=state.sessions.find(x=>x.status==='done'&&x.date===r.date&&x.log&&!x.log.strava);
      if(manual){ // ya registrada a mano: se completa con los datos de Strava, sin contarla dos veces
        Object.assign(manual.log,{km:Math.round(r.km*100)/100,time:r.sec,hr:r.hr,strava:r.id,elev:r.elev,gap:r.gap||null});
        if(!manual.log.workPace&&QUALITY.includes(manual.type)) manual.log.workPace=workPaceOf(r);
        r.sessionId=manual.id;matched++;return;
      }
      let cand=state.sessions.filter(x=>open(x)&&x.date===r.date);
      if(!cand.length) cand=state.sessions.filter(x=>open(x)&&monday(x.date)===monday(r.date)&&Math.abs(daysBetween(x.date,r.date))<=2);
      if(!cand.length){r.extra=true;return;}
      cand.sort((a,b)=>(a.date===r.date?0:1)-(b.date===r.date?0:1)||Math.abs(a.km-r.km)-Math.abs(b.km-r.km));
      const x=cand[0];
      if(x.status==='skipped'){
        const copy=state.sessions.find(y=>y.moved&&y.from===x.date&&y.type===x.type&&y.status==='pending');
        if(copy) state.sessions=state.sessions.filter(y=>y!==copy);
      }
      x.status='pending';
      if(x.date!==r.date){x.plannedDate=x.date;x.date=r.date;}
      r.sessionId=x.id;matched++;names.push(TYPES[x.type].n.toLowerCase());
      logDone(x,runLog(r,x));
    });
    sortSessions();
  }
  let fit=state.fitness?fitnessFromEfforts():null;
  if(state.adapt){updateHR();if(fitnessFromHR())fit=true;}
  const fat=state.plan?checkFatigue():null;
  if(state.plan) goalCheck();
  return {matched,names,fit,fat};
}
function bestImplied(days){
  const s=state.strava;if(!s) return null;
  const from=addDays(today(),-days);let best=null;
  s.runs.filter(r=>r.date>=from).forEach(r=>{
    const c=r.be.filter(b=>b.d>=1600).map(b=>({p:b.t*Math.pow(5000/b.d,1.06)/5,n:BE_NAMES[b.n]||b.n,date:r.date}));
    if(r.race&&r.km>=3) c.push({p:r.sec*Math.pow(5/r.km,1.06)/5,n:'carrera',date:r.date});
    c.forEach(v=>{if(v.p>150&&(!best||v.p<best.p))best=v;});
  });
  return best;
}
function fitnessFromEfforts(){
  const b=bestImplied(42),p=state.fitness.p;
  if(b&&b.p<p*0.99){
    return setFitness(Math.max(b.p,p*0.97),`Strava: tu mejor esfuerzo en ${b.n} (${fdShort(b.date)}) muestra que estás más en forma.`);
  }
  return false;
}

/* ---------- carga: forma (42 días) y fatiga (7 días) ---------- */
function activities(){
  const out=[];
  (state.strava?state.strava.runs:[]).forEach(r=>out.push({date:r.date,km:r.km,sec:r.sec,hr:r.hr,elev:r.elev,gap:r.gap||null,src:'strava',run:r}));
  state.sessions.filter(x=>x.status==='done'&&x.log&&!x.log.strava).forEach(x=>out.push({date:x.date,km:x.log.km||x.km,sec:x.log.time||null,elev:x.log.elev,gap:x.log.gap||null,src:'manual',session:x}));
  (state.manual||[]).forEach(m=>out.push({date:m.date,km:m.km,sec:m.time,hr:m.hr,elev:m.elev,gap:m.gap||null,src:'manual',manual:m}));
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
function loadOf(a,p){
  if(!a.km) return 0;
  const sec=a.sec||a.km*p*1.32;
  const pace=a.gap||(a.sec?gapFromElev(a.sec,a.km,a.elev):sec/a.km);
  const IF=clamp(p*1.07/pace,0.5,1.15);
  return sec/3600*IF*IF*100;
}
function loadSeries(){
  const p=state.fitness?state.fitness.p:315,acts=activities(),by={};
  acts.forEach(a=>{by[a.date]=(by[a.date]||0)+loadOf(a,p);});
  if(!acts.length) return [];
  const kC=1-Math.exp(-1/42),kA=1-Math.exp(-1/7);
  let ctl=0,atl=0;const out=[];
  for(let d=acts[0].date;d<=today();d=addDays(d,1)){
    const l=by[d]||0;ctl+=(l-ctl)*kC;atl+=(l-atl)*kA;
    out.push({date:d,ctl,atl,tsb:ctl-atl,load:l});
  }
  return out;
}
function formState(){
  const ls=loadSeries();if(ls.length<28) return null;
  const x=ls[ls.length-1];
  const lab=x.tsb>10?['Fresco','ok']:x.tsb>-10?['Equilibrado','']:x.tsb>-25?['Cargando','w']:['Fatiga alta','q'];
  return {ctl:x.ctl,atl:x.atl,tsb:x.tsb,label:lab[0],cls:lab[1],span:ls.length};
}
function checkFatigue(){
  const f=formState(),ad=state.adapt,td=today();
  if(!f||f.span<42) return false;
  if(f.tsb<-25&&f.atl>f.ctl*1.4&&(!ad.lastFatigue||daysBetween(ad.lastFatigue,td)>=7)){
    ad.lastFatigue=td;const pct=setLoad(0.9);ad.intensity=Math.max(-2,ad.intensity-1);
    addEvent('down',`Tu carga de los últimos 7 días es mucho mayor que tu forma de base. Bajo el volumen un ${Math.abs(pct)} % esta semana para absorberla sin lesionarte.`);
    regenerate();return true;
  }
  return false;
}
function stravaSummary(){
  const s=state.strava;if(!s||!s.runs.length) return null;
  const from=addDays(today(),-28);
  const rec=s.runs.filter(r=>r.date>=from);
  const km=rec.reduce((a,r)=>a+r.km,0)/4;
  const cnt=[0,0,0,0,0,0,0];rec.forEach(r=>cnt[dow(r.date)]++);
  const perWeek=Math.round(rec.length/4);
  const days=cnt.map((c,i)=>[c,i]).sort((a,b)=>b[0]-a[0]).slice(0,clamp(perWeek,2,6)).map(x=>x[1]).sort((a,b)=>a-b);
  const longest=rec.slice().sort((a,b)=>b.km-a.km)[0];
  const best=bestImplied(42)||bestImplied(120);
  return {km,perWeek,days:rec.length?days:null,longDay:longest?dow(longest.date):null,best,n:s.runs.length};
}

/* =========================================================
   Análisis de cada sesión
   ========================================================= */
function runOf(s){return s.log&&s.log.strava&&state.strava?state.strava.runs.find(r=>r.id===s.log.strava):null;}
function snapOf(s){
  // referencia guardada al registrar; si no existe (registros antiguos), la actual
  if(s.snap&&s.snap.main) return s.snap;
  const d=describe(s),m=d.blocks.filter(b=>b.k==='main');
  return {title:d.title,lo:d.lo,hi:d.hi,rpe:d.rpe,km:s.km,main:m.map(b=>({t:b.t,reps:b.reps||1,dist:b.dist||null,dur:b.dur||null,lo:b.lo,hi:b.hi}))};
}
function analyze(s){
  if(s.status!=='done'||!s.log) return null;
  const sn=snapOf(s),r=runOf(s),p=state.fitness.p,hm=hrMaxNow();
  const items=[],notes=[];let laps=null;
  const add=(ok,label,text)=>items.push({ok,label,text});
  const km=s.log.km||null,time=s.log.time||null,pace=km&&time?time/km:null;
  // 1) distancia
  const planKm=s.type==='test'?5:sn.km||s.km;
  if(km&&s.type!=='runwalk'&&s.type!=='cuestas'&&s.type!=='fartlek'){
    const ratio=km/planKm;
    add(ratio>=0.9&&ratio<=1.2?true:ratio<0.75?false:'warn','Distancia',`${fk(km)} de ${fk(planKm)} km previstos${ratio<0.9?` (${Math.round((1-ratio)*100)} % menos)`:ratio>1.2?` (${Math.round((ratio-1)*100)} % más)`:''}.`);
  }
  const easyType=['easy','long'].includes(s.type);
  const mains=(sn.main||[]).filter(b=>b.lo);
  const mainB=s.type==='race'?mains[mains.length-1]||null:mains[0]||null;
  // 2) ritmo
  if(s.type==='runwalk'){
    const plan=describe(s).dur;
    if(time) add(time/60>=plan*0.85?true:time/60>=plan*0.6?'warn':false,'Duración',`${Math.round(time/60)} de ${plan} minutos previstos.`);
    notes.push('En correr y andar no miro el ritmo: lo importante es completar los bloques sin ahogarte.');
  }else if(s.type==='cuestas'){
    notes.push('En las cuestas cuenta el esfuerzo, no el ritmo: por eso no analizo el ritmo de esta sesión.');
  }else if(easyType){
    const lo=sn.lo,hi=sn.hi;
    // en tiradas con final a ritmo de carrera, los últimos km no cuentan como suaves
    const finKm=s.rpFinish?Math.round((sn.main||[]).filter(b=>/carrera/i.test(b.t)).reduce((a,b)=>a+(b.dist||0),0)):0;
    let segs=r&&r.splits.length?r.splits.filter(x=>x.km>=0.5):[];
    if(finKm&&segs.length>finKm) segs=segs.slice(0,segs.length-finKm);
    if(segs.length>=2){
      const pc=x=>x.gap||x.sec/x.km,useGap=segs.some(x=>x.gap&&Math.abs(x.gap/(x.sec/x.km)-1)>0.03);
      const fast=segs.filter(x=>pc(x)<lo*0.97).length;
      add(fast/segs.length<=0.25?true:fast/segs.length<=0.5?'warn':false,'Ritmo suave',(fast?`${fast} de ${segs.length} km por debajo de ${fp(lo)} /km: más rápido de lo que toca.`:`Todos los km en ritmo suave o más lento. Bien hecho.`)+(useGap?' Ritmos ajustados por la pendiente.':''));
      laps=segs.map((x,i)=>({n:i+1,km:x.km,pace:pc(x),hr:x.hr,st:pc(x)<lo*0.97?'rápido':pc(x)>hi*1.12?'lento':'ok'}));
    }else if(pace){
      const gp=s.log.gap||gapFromElev(time,km,s.log.elev)||pace;
      add(gp>=lo*0.97?true:'warn','Ritmo suave',gp>=lo*0.97?`Media de ${fp(gp)} /km${gp!==pace?' (ajustado por desnivel)':''}, dentro de lo suave.`:`Media de ${fp(gp)} /km: más rápido que tu zona suave (${paceR(lo,hi)}).`);
    }
    if(hrBounds(2)&&segs.length>=2&&segs.every(x=>x.hr)){
      const hi80=hrBounds(2)[1],over=segs.filter(x=>x.hr>hi80).length;
      add(over/segs.length<=0.25?true:'warn','Pulso',over?`${over} de ${segs.length} km por encima de ${Math.round(hi80)} ppm (Z2).`:`Siempre en Z2 o por debajo.`);
      if(segs.length>=6){ // desacople aeróbico: eficiencia (velocidad/pulso) 1.ª mitad vs 2.ª
        const h=Math.floor(segs.length/2),ef=a=>a.reduce((x,y)=>x+y.km,0)/a.reduce((x,y)=>x+y.sec,0)/(a.reduce((x,y)=>x+y.hr*y.km,0)/a.reduce((x,y)=>x+y.km,0));
        const dec=ef(segs.slice(0,h))/ef(segs.slice(h))-1;
        add(dec<=0.05?true:'warn','Desacople',dec<=0.05?`Pulso estable de principio a fin (${(dec*100).toFixed(1).replace('.',',')} %): buena base aeróbica.`:`El pulso subió un ${(dec*100).toFixed(1).replace('.',',')} % para el mismo ritmo en la segunda mitad. Con calor es normal; si no, falta base: los suaves, más suaves.`);
      }
    }
  }else if(mainB&&(s.type==='test'||s.type==='race')){
    const target=s.type==='test'?(mainB.lo+mainB.hi)/2:(mainB.lo+mainB.hi)/2;
    if(pace){const d=pace/target-1;add(d<=0.01?true:d<=0.04?'warn':false,'Resultado',`${ft(time)} a ${fp(pace)} /km (referencia ${fp(target)} /km). ${d<-0.01?'¡Mejor de lo previsto!':d<=0.01?'Justo lo previsto.':'Algo por debajo de lo previsto.'}`);}
  }else if(mainB){
    const lo=mainB.lo,hi=mainB.hi,easyLo=p*1.22;
    let segs=r?(r.laps.length>=3?r.laps:r.splits).filter(x=>x.km>=0.1):[];
    const auto=segs.length>=3&&segs.filter(x=>Math.abs(x.km-1)<0.03).length>=segs.length*0.7;
    const repDist=mainB.dist;
    if(segs.length&&auto&&((repDist&&repDist<0.9)||mainB.dur)){
      notes.push('Tu reloj marcó vueltas automáticas cada km, así que no puedo ver cada serie. Pulsa vuelta al empezar y al acabar cada serie (o crea el entreno en el reloj) y la próxima vez te las analizo una a una.');
      segs=[];
    }
    // separar trabajo y recuperación: mayor salto entre ritmos ordenados (si es claro); si no, umbral fijo
    let cut=(easyLo+hi)/2;
    if(segs.length>=3){
      const ps=segs.map(x=>x.sec/x.km).sort((a,b)=>a-b);let best=0,at=null;
      for(let i=0;i<ps.length-1;i++){const g=ps[i+1]/ps[i]-1;if(g>best){best=g;at=(ps[i]+ps[i+1])/2;}}
      if(best>=0.06&&at) cut=Math.min(at,easyLo);
    }
    const work=segs.filter(x=>x.sec/x.km<cut);
    if(work.length){
      laps=work.map((x,i)=>{const pc=x.sec/x.km;return {n:i+1,km:x.km,pace:pc,hr:x.hr,st:pc<lo*0.98?'rápida':pc>hi*1.02?'lenta':'ok'};});
      const ok=laps.filter(x=>x.st==='ok').length,slow=laps.filter(x=>x.st==='lenta').length,fast=laps.filter(x=>x.st==='rápida').length;
      add(ok>=laps.length*0.7?true:slow>laps.length/2?false:'warn','Ritmo de trabajo',`${ok} de ${laps.length} en ritmo (${paceR(lo,hi)} /km)${fast?`, ${fast} más rápidas`:''}${slow?`, ${slow} más lentas`:''}.`);
      if(mainB.reps>1&&!auto) add(laps.length>=mainB.reps?true:laps.length>=mainB.reps*0.75?'warn':false,'Repeticiones',`${laps.length} de ${mainB.reps} hechas.`);
      if(laps.length>=4){
        const t=Math.max(1,Math.floor(laps.length/3)),avg=a=>a.reduce((x,y)=>x+y.pace,0)/a.length;
        const fade=avg(laps.slice(-t))/avg(laps.slice(0,t))-1;
        add(fade<=0.03?true:'warn','Regularidad',fade<=-0.01?'Acabaste más rápido que empezaste: gestión perfecta.':fade<=0.03?'Ritmo regular de principio a fin.':`Las últimas fueron un ${Math.round(fade*100)} % más lentas que las primeras: sal un poco más contenido.`);
      }
    }else if(s.log.workPace){
      const d=s.log.workPace/((lo+hi)/2)-1;
      add(Math.abs(d)<=0.02?true:'warn','Ritmo de trabajo',`Parte rápida a ${fp(s.log.workPace)} /km (objetivo ${paceR(lo,hi)}).`);
    }else if(!r) notes.push('Para analizar cada serie hacen falta los datos de Strava, o al menos el ritmo medio de la parte rápida al registrar.');
  }
  // 3) esfuerzo
  if(s.log.rpe&&s.log.rpeSrc!=='previsto'&&sn.rpe){
    const d=s.log.rpe-sn.rpe;
    add(Math.abs(d)<=1?true:'warn','Esfuerzo',`${s.log.rpe}/10${s.log.rpeSrc==='fc'?' (por pulso)':''} frente a ${sn.rpe}/10 previsto${d>=2?': te costó más de la cuenta':d<=-2?': te resultó fácil':''}.`);
  }
  const bad=items.filter(x=>x.ok===false).length,warn=items.filter(x=>x.ok==='warn').length;
  const verdict=bad?['Incompleta','q']:warn?['Cumplida con matices','w']:['Cumplida','ok'];
  return {verdict,items,laps,notes,changes:s.log.events||[]};
}
function analysisHTML(s){
  const a=analyze(s);if(!a) return '';
  const mk=ok=>ok===true?'<span class="am ok" aria-label="bien">✓</span>':ok==='warn'?'<span class="am w" aria-label="mejorable">!</span>':'<span class="am q" aria-label="no cumplido">×</span>';
  const easyType=['easy','long','runwalk'].includes(s.type);
  const lapRows=a.laps&&a.laps.length?`<div class="laps"><table><thead><tr><th>${easyType?'Km':'#'}</th><th>Dist.</th><th>Ritmo</th><th>Pulso</th><th></th></tr></thead><tbody>${a.laps.map(l=>`<tr><td>${l.n}</td><td>${fm(l.km)}</td><td>${fp(l.pace)}</td><td>${l.hr?Math.round(l.hr):'–'}</td><td class="${l.st==='ok'?'ok':'w'}">${l.st==='ok'?'✓':l.st}</td></tr>`).join('')}</tbody></table></div>`:'';
  return `<section class="stack analysis" style="gap:8px"><div class="row between"><h3>Análisis</h3><span class="chip ${a.verdict[1]}">${a.verdict[0]}</span></div>
    <ul class="aitems">${a.items.map(i=>`<li>${mk(i.ok)}<div><b>${i.label}</b><br><span class="small">${esc(i.text)}</span></div></li>`).join('')}</ul>

    ${a.changes.length?`<div class="stack" style="gap:4px"><span class="eyebrow">Qué ha cambiado en tu plan</span>${a.changes.map(c=>`<p class="small">${esc(c)}</p>`).join('')}</div>`:''}
  </section>`;
}

const inactive=s=>s.status==='skipped'||s.status==='paused';
function moveOptions(s){
  const td=today(),mon=monday(td);
  if(s.status!=='pending'||s.type==='race'||monday(s.date)!==mon) return [];
  const out=[];
  for(let d=td;d<=addDays(mon,6);d=addDays(d,1)){
    const other=state.sessions.find(x=>x.date===d&&x.status==='pending'&&x.id!==s.id);
    const done=state.sessions.some(x=>x.date===d&&x.status==='done');
    out.push({d,cur:d===s.date,other,blocked:done||(other&&other.type==='race')});
  }
  return out;
}
function moveSession(s,d){
  if(d===s.date) return null;
  const other=state.sessions.find(x=>x.date===d&&x.status==='pending'&&x.id!==s.id);
  const from=s.date;
  if(other){other.date=from;other.manual=true;}
  s.date=d;s.manual=true;sortSessions();
  const isKey=x=>KEY_TYPES.includes(x.type)||x.type==='race';
  const near=state.sessions.filter(x=>x.status==='pending'&&x.id!==s.id&&isKey(x)&&Math.abs(daysBetween(x.date,d))===1);
  const warn=isKey(s)&&near.length?`Ojo: queda pegada a ${TYPES[near[0].type].n.toLowerCase()} del ${DAYS_L[dow(near[0].date)]}. Si puedes, deja un día suave entre las dos.`:'';
  return (other?`Cambiadas: ${TYPES[s.type].n.toLowerCase()} pasa al ${DAYS_L[dow(d)]} y ${TYPES[other.type].n.toLowerCase()} al ${DAYS_L[dow(from)]}.`:`${TYPES[s.type].n} movida al ${DAYS_L[dow(d)]}.`)+(warn?' '+warn:'');
}
const PAUSE_R={lesion:'Lesión o molestia',enfermedad:'Enfermedad',viaje:'Vacaciones o viaje'};
function startPause(reason,to){
  state.pause={reason,from:today(),to:to||null};
  addEvent('info',`Plan en pausa (${PAUSE_R[reason].toLowerCase()})${to?` hasta el ${fdShort(to)}`:''}. Las sesiones de estos días no cuentan como saltadas.`);
}
function resumePlan(){
  const P=state.pause;if(!P) return;
  const td=today(),days=Math.max(0,daysBetween(P.from,td)),ad=state.adapt;
  if(days===0){state.pause=null;addEvent('info','Pausa cancelada: el plan sigue igual.');return;}
  state.sessions.forEach(s=>{if(s.status==='pending'&&s.date>=P.from&&s.date<td){s.status='paused';}});
  state.pause=null;
  let f=1,easyDays=0,fit=0;
  if(days>=28){f=0.6;easyDays=14;fit=0.05;}
  else if(days>=14){f=0.7;easyDays=10;fit=0.03;}
  else if(days>=6){f=0.85;easyDays=6;fit=0.01;}
  else if(P.reason!=='viaje'){f=0.9;easyDays=4;}
  if(P.reason==='lesion'){f=Math.min(f,0.8);easyDays=Math.max(easyDays,7);}
  if(f<1) setLoad(f);
  if(easyDays){ad.easyUntil=addDays(td,easyDays-1);}
  if(fit) setFitness(state.fitness.p*(1+fit),`Tras ${days} días sin entrenar se pierde algo de forma.`,true);
  ad.feelFrom=Date.now();ad.lastGapAdj=td;
  addEvent('down',`Vuelves tras ${days} día${days===1?'':'s'} de pausa (${PAUSE_R[P.reason].toLowerCase()}). ${f<1?`Bajo la carga un ${Math.round((1-f)*100)} %`:'Mantengo la carga'}${easyDays?` y los próximos ${easyDays} días son solo rodajes suaves`:''}.${P.reason==='lesion'?' Si vuelve la molestia, para y consulta a un fisioterapeuta.':''}`);
  regenerate();
}
function applyEasyUntil(list){
  const u=state.adapt&&state.adapt.easyUntil;if(!u) return list;
  list.forEach(s=>{if(s.status==='pending'&&s.date<=u&&s.date>=today()&&QUALITY.includes(s.type)&&s.type!=='race'){s.type='easy';s.converted=true;s.km=r05(Math.min(s.km,8));}});
  return list;
}

const PHASE_TIP={base:'Construir base: los rodajes, suaves de verdad. Es lo que más rinde a largo plazo.',desarrollo:'Llegan las sesiones de calidad: llega descansado a ellas y no conviertas los suaves en carreras.',pico:'Las semanas más exigentes: prioriza dormir bien y comer suficiente.','puesta a punto':'Menos volumen para llegar fresco a la carrera. No compenses entrenando de más.'};
function weekSummary(mon){
  const end=addDays(mon,6);
  const ss=state.sessions.filter(s=>s.date>=mon&&s.date<=end&&s.status!=='paused');
  if(!ss.length) return null;
  const done=ss.filter(s=>s.status==='done');
  const kmDone=activities().filter(a=>a.date>=mon&&a.date<=end).reduce((a,x)=>a+x.km,0);
  const kmPlan=ss.filter(s=>!(s.status==='skipped'&&s.moved)).reduce((a,s)=>a+(s.snap&&s.snap.km||s.km),0);
  const an=done.map(analyze).filter(Boolean);
  const okQ=done.filter(s=>QUALITY.includes(s.type)).map(s=>[s,analyze(s)]);
  const feel=done.filter(s=>s.log&&s.log.rpeSrc!=='previsto'&&s.rpeExp).map(s=>s.log.rpe-s.rpeExp);
  const fAvg=feel.length?feel.reduce((a,b)=>a+b,0)/feel.length:null;
  const evs=state.adapt.events.filter(e=>e.date>mon&&e.date<=addDays(end,1)).length;
  return {mon,end,done:done.length,total:ss.filter(s=>s.status!=='pending'||s.date<=end).length,kmDone,kmPlan,
    quality:okQ.map(([s,a])=>`${TYPES[s.type].n}: ${a.verdict[0].toLowerCase()}`),
    feel:fAvg==null?null:fAvg>=1.5?'más duro de lo previsto':fAvg<=-1.5?'más fácil de lo previsto':'como estaba previsto',evs,cumplidas:an.filter(a=>a.verdict[1]==='ok').length};
}

/* ---------- Plan ---------- */
function sessionCard(s,isToday){
  const d=describe(s),st=s.status,td=today();
  const showLog=st==='pending'&&s.date<=td&&!state.pause;
  const timeBased=['runwalk','fartlek','cuestas'].includes(s.type);
  const head=`<div class="row between"><span class="eyebrow">${isToday?'Hoy':fdLong(s.date)}${s.moved||s.manual?' · cambiada de día':''}${s.converted?' · ajustada':''}</span>${chipFor(s)}</div>
    <h2>${d.title}</h2>
    <div class="row" style="gap:20px;align-items:flex-end">
      <div><span class="big num">${timeBased?d.dur:fk(s.km)}</span><span class="unit">${timeBased?'min':'km'}</span></div>
      <div class="small muted num" style="padding-bottom:4px">${timeBased?`≈ ${fk(d.estKm)} km`:`≈ ${d.dur} min`}<br>esfuerzo ${d.rpe}/10</div>
    </div>`;
  const plan=`${blocksHTML(d)}${d.tips.length?`<ul class="steps small">${d.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}`;
  let body='';
  if(st==='done'){
    body=`<div class="stack" style="gap:6px"><div class="row between"><span class="chip ok">Hecha${s.log.strava?' · Strava':''}</span><span class="small muted num">${s.log.km?fk(s.log.km)+' km':''}${s.log.time?' · '+ft(s.log.time):''}${s.log.km&&s.log.time?' · '+fp(s.log.time/s.log.km)+' /km':''}</span></div>
      <span class="small muted num">${s.log.hr?Math.round(s.log.hr)+' ppm de media · ':''}esfuerzo ${s.log.rpe}/10${s.log.rpeSrc==='fc'?' (estimado por pulso)':s.log.rpeSrc==='previsto'?' (sin valorar)':''}</span>
      ${s.log.strava?`<a class="small" style="color:#FC5200;font-weight:600" href="https://www.strava.com/activities/${s.log.strava}" target="_blank" rel="noopener">Ver en Strava</a>`:''}</div>
      ${analysisHTML(s)}
      <details class="adv"><summary>Ver el entreno previsto</summary>${plan}</details>`;
  }else{

  }
  return `<section class="hero stack">${head}${body}

    ${showLog?`<div class="grid2"><button class="ghost" data-act="skip" data-id="${s.id}">No he podido</button><button class="primary" data-act="log" data-id="${s.id}">Registrar</button></div>`:''}

}
function moveHTML(s){

    <div class="seg" role="group">${opts.map(o=>`<button type="button" data-act="move" data-id="${s.id}" data-d="${o.d}" aria-pressed="${o.cur}" ${o.blocked?'disabled':''}>${o.d===td?'Hoy':DAYS[dow(o.d)]+' '+pd(o.d).getDate()}${o.other&&!o.cur?` · ${TYPES[o.other.type].k.toLowerCase()}`:''}</button>`).join('')}</div>

function openSession(id){

    <div class="grid2"><a class="btn" href="#zonas" data-act="close" style="text-align:center;text-decoration:none">Ver mis zonas</a><button class="ghost" data-act="close">Cerrar</button></div></div>`);

// semanas desplegadas en Plan: se recuerdan mientras usas la app
let openWeeks=null;
document.addEventListener('toggle',e=>{const d=e.target;if(!d.classList||!d.classList.contains('wk'))return;if(!openWeeks){openWeeks=new Set();document.querySelectorAll('details.wk[open]').forEach(x=>openWeeks.add(+x.dataset.w));}if(d.open)openWeeks.add(+d.dataset.w);else openWeeks.delete(+d.dataset.w);},true);

  const g=GOALS[state.profile.goal];
  app.innerHTML=`<div class="stack-lg"><header class="stack" style="gap:6px"><div class="lanes" aria-hidden="true"></div><h1>Tu plan</h1><p class="muted">${plan.curve.length} semanas · ${g.name} · ${state.profile.days.map(d=>DAYS[d]).join(', ')}. Las semanas futuras se recalculan cada vez que registras algo.</p>
    <div class="grid2">${state.pause?'<button data-act="resume">Retomar el plan</button>':'<button data-act="pause">Pausar el plan</button>'}<a class="btn" href="#perfil" style="text-align:center;text-decoration:none">Cambiar días</a></div></header><div class="stack">${weeks}</div></div>`;

/* ---------- Progreso ---------- */
function niceMax(v){if(v<=0)return 10;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;}
function barChart(){
  const ws=weeksSeries();const W=340,H=170,L=30,B=22,T=8;const max=niceMax(Math.max(...ws.map(w=>Math.max(w.plan,w.done||0)),5));
  const bw=(W-L)/ws.length;const y=v=>T+(H-T-B)*(1-v/max);
  const ticks=[0,max/2,max];
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilómetros por semana, planificados y hechos">`;
  ticks.forEach(t=>{s+=`<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fk(t)}</text>`;});
  ws.forEach((w,i)=>{
    const x=L+i*bw,iw=Math.min(14,(bw-6)/2);const cx=x+bw/2;
    const ph=H-B-y(w.plan);
    s+=`<rect x="${cx-iw-1}" y="${y(w.plan)}" width="${iw}" height="${Math.max(0,ph)}" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="${w.future?'3 3':'0'}"/>`;
    if(w.done!=null){const dh=H-B-y(w.done);s+=`<rect x="${cx+1}" y="${y(w.done)}" width="${iw}" height="${Math.max(0,dh)}" rx="3" fill="var(--accent)"/>`;}
    if(i%2===0||ws.length<=7) s+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${fdShort(w.m)}</text>`;
    s+=`<rect class="hit" x="${x}" y="0" width="${bw}" height="${H-B}" fill="transparent" data-tip="Semana del ${fdShort(w.m)}: ${w.done!=null?fk(w.done)+' km hechos de ':''}${fk(w.plan)} km planificados"/>`;
  });
  s+=`<line x1="${L}" x2="${W}" y1="${H-B}" y2="${H-B}" stroke="var(--muted)" stroke-width="1"/></svg>`;
  return `<div class="chart"><div class="legend"><span><i style="border:1.5px solid var(--muted)"></i>Planificado</span><span><i style="background:var(--accent)"></i>Hecho</span></div>${s}<div class="tip" aria-live="polite">Toca una semana para ver el detalle.</div></div>`;
}
function lineChart(){
  const h=state.fitness.history;
  if(h.length<2) return `<p class="muted small">Cuando registres un test de 5 km o sesiones de calidad con su ritmo, aquí verás cómo evoluciona tu marca estimada.</p>`;
  const W=340,H=150,L=44,B=22,T=12;
  const vals=h.map(x=>x.p*5);const mn=Math.min(...vals),mx=Math.max(...vals);const pad=Math.max(20,(mx-mn)*0.2);
  const lo=mn-pad,hi=mx+pad;
  const t0=pd(h[0].date).getTime(),t1=Math.max(pd(h[h.length-1].date).getTime(),pd(today()).getTime(),t0+864e5);
  const x=d=>L+(W-L-8)*((pd(d).getTime()-t0)/(t1-t0));
  const y=v=>T+(H-T-B)*((v-lo)/(hi-lo)); // menos tiempo = más arriba
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del tiempo estimado en 5 km">`;
  [lo+pad,hi-pad].forEach(v=>{s+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${ft(v)}</text>`;});
  let path='';h.forEach((p,i)=>{const X=x(p.date),Y=y(p.p*5);path+=i?` H${X} V${Y}`:`M${X} ${Y}`;});
  path+=` H${W-8}`;
  s+=`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  h.forEach((p,i)=>{const X=x(p.date),Y=y(p.p*5),last=i===h.length-1;s+=`<circle cx="${X}" cy="${Y}" r="${last?5:3.5}" fill="${last?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/><circle class="hit" cx="${X}" cy="${Y}" r="14" fill="transparent" data-tip="${fdShort(p.date)}: ${ft(p.p*5)} en 5 km (${fp(p.p)} /km)"/>`;});
  s+=`<text x="${L}" y="${H-6}" font-size="10.5" fill="var(--muted)">${fdShort(h[0].date)}</text><text x="${W-8}" y="${H-6}" text-anchor="end" font-size="10.5" fill="var(--muted)">Hoy</text></svg>`;
  return `<div class="chart">${s}<div class="tip" aria-live="polite">Toca un punto para ver el detalle.</div></div>`;
}
function formChart(){
  const ls=loadSeries().slice(-84);
  if(ls.length<28) return `<p class="muted small">Necesito al menos 4 semanas de carreras (de Strava o registradas aquí) para calcular tu forma y tu fatiga.</p>`;
  const W=340,H=150,L=30,B=22,T=10;
  const mx=niceMax(Math.max(...ls.map(x=>Math.max(x.ctl,x.atl)),10));
  const x=i=>L+(W-L-6)*(i/(ls.length-1)),y=v=>T+(H-T-B)*(1-v/mx);
  const path=k=>ls.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p[k]).toFixed(1)}`).join(' ');
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Forma y fatiga en las últimas semanas">`;
  [0,mx/2,mx].forEach(t=>{s+=`<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(t)}</text>`;});
  s+=`<path d="${path('atl')}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 3"/>`;
  s+=`<path d="${path('ctl')}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  const li=ls.length-1;
  s+=`<circle cx="${x(li)}" cy="${y(ls[li].ctl)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  const step=Math.max(1,Math.floor(ls.length/12));
  ls.forEach((p,i)=>{if(i%step)return;const w=(W-L)/ls.length*step;s+=`<rect class="hit" x="${x(i)-w/2}" y="0" width="${w}" height="${H-B}" fill="transparent" data-tip="${fdShort(p.date)}: forma ${Math.round(p.ctl)} · fatiga ${Math.round(p.atl)} · balance ${p.tsb>0?'+':''}${Math.round(p.tsb)}"/>`;});
  s+=`<text x="${L}" y="${H-6}" font-size="10.5" fill="var(--muted)">${fdShort(ls[0].date)}</text><text x="${W-6}" y="${H-6}" text-anchor="end" font-size="10.5" fill="var(--muted)">Hoy</text></svg>`;
  return `<div class="chart"><div class="legend"><span><i style="background:var(--accent)"></i>Forma (42 días)</span><span><i style="border:2px dashed var(--muted)"></i>Fatiga (7 días)</span></div>${s}<div class="tip" aria-live="polite">La forma sube con semanas constantes; la fatiga refleja lo último. Toca la gráfica para ver un día.</div></div>`;
}
function racePrediction(){
  const pr=state.profile,g=GOALS[pr.goal];

  const p=state.fitness.p,h=state.fitness.history.filter(x=>x.date>=addDays(today(),-56));

    <p class="small muted">${rate>0?`Calculada con tu ritmo de mejora de las últimas semanas (${(rate*100).toFixed(1).replace('.',',')} % por semana), con un límite prudente.`:'Aún no hay mejora medida: la previsión es tu forma actual. Se afinará con los tests y las carreras de Strava.'}</p></div>`;
}
function renderProgreso(){
  const p=state.fitness.p,acts=activities();

  const pred=[['5 km',5],['10 km',10],['Media',21.0975],['Maratón',42.195]].map(([n,d])=>`<div><b class="num">${ft(p*5*Math.pow(d/5,1.06))}</b><span>${n}</span></div>`).join('');
  const evs=state.adapt.events.map(e=>`<div class="ev"><span class="mk ${e.kind}" aria-hidden="true"></span><div><span class="small muted">${fdShort(e.date)} · ${e.kind==='up'?'Sube':e.kind==='down'?'Baja':'Ajuste'}</span><p>${esc(e.text)}</p></div></div>`).join('');
  const hist=acts.slice().reverse().slice(0,20).map(x=>{
    const ses=x.session||(x.run&&x.run.sessionId?state.sessions.find(s=>s.id===x.run.sessionId):null);

function weeksSeries(){
  const acts=activities();
  const cw=monday(today());
  const firstS=state.sessions.length?monday(state.sessions[0].date):cw;
  const firstA=acts.length?monday(acts[0].date):cw;
  let first=firstS<firstA?firstS:firstA;
  if(daysBetween(first,cw)>77) first=addDays(cw,-77);
  const out=[];
  for(let m=first;m<=addDays(cw,14);m=addDays(m,7)){
    const end=addDays(m,6);
    const inW=state.sessions.filter(s=>s.date>=m&&s.date<=end);
    out.push({m,plan:inW.reduce((a,s)=>a+(s.status==='done'&&s.log&&s.log.km?s.log.km:s.km)*(s.status==='paused'||(s.status==='skipped'&&s.moved)?0:1),0),
      done:m<=cw?acts.filter(a=>a.date>=m&&a.date<=end).reduce((a,x)=>a+x.km,0):null,future:m>cw});
  }
  return out.slice(-12);
}

/* =========================================================
   Campos de tiempo: solo números, los dos puntos se ponen solos
   ========================================================= */
function fmtDigits(dg,kind){
  dg=dg.replace(/\D/g,'').replace(/^0+(?=\d{3})/,'').slice(0,kind==='pace'?4:6);
  if(dg.length<=2) return dg;
  if(kind==='pace'||dg.length<=4) return dg.slice(0,-2)+':'+dg.slice(-2);
  return dg.slice(0,-4)+':'+dg.slice(-4,-2)+':'+dg.slice(-2);
}

/* =========================================================
   Selectores de rueda (en el iPhone se abren como ruedas nativas)
   ========================================================= */
const rng=(a,b,step)=>{const o=[];for(let i=a;i<=b;i+=step||1)o.push(i);return o;};
function sel(part,label,opts,cur,ph){
  return `<select data-part="${part}" aria-label="${label}">${ph!=null?`<option value=""${cur===''||cur==null?' selected':''}>${ph}</option>`:''}${opts.map(([v,l])=>`<option value="${v}"${String(cur)===String(v)?' selected':''}>${l}</option>`).join('')}</select>`;
}
// valor guardado en un input oculto (con data-f para el asistente), compuesto desde las ruedas
function pickerHTML(id,f,kind,val,optional){
  let parts='';
  if(kind==='dur'){
    const t=parseTime(val),h=t!=null?Math.floor(t/3600):'',m=t!=null?Math.floor(t%3600/60):'',s=t!=null?t%60:'';
    parts=sel('h','horas',rng(0,9).map(i=>[i,`${i} h`]),t!=null?h:'', '– h')+'<span class="sep">:</span>'+sel('m','minutos',rng(0,59).map(i=>[i,pad(i)]),m,'– min')+'<span class="sep">:</span>'+sel('s','segundos',rng(0,59).map(i=>[i,pad(i)]),s,'– s');
  }else if(kind==='pace'){
    const t=parseTime(val),m=t!=null?Math.floor(t/60):'',s=t!=null?t%60:'';
    parts=sel('m','minutos por km',rng(2,15).map(i=>[i,`${i}`]),m,'– min')+'<span class="sep">:</span>'+sel('s','segundos',rng(0,59).map(i=>[i,pad(i)]),s,'– s')+'<span class="pu">/km</span>';
  }else if(kind==='dist'){
    const v=val!==''&&val!=null?parseFloat(String(val).replace(',','.')):null,k=v!=null?Math.floor(v+1e-9):'',d=v!=null?Math.round((v-Math.floor(v+1e-9))*10)%10:'';
    parts=sel('k','kilómetros',rng(0,60).map(i=>[i,`${i}`]),k,'– km')+'<span class="sep">,</span>'+sel('d','décimas',rng(0,9).map(i=>[i,`${i}`]),d,'–')+'<span class="pu">km</span>';
  }
  return `<div class="picker${val?' set':''}" data-kind="${kind}" data-target="${id}">${parts}${optional?`<button type="button" class="pclear" data-act="pclear" aria-label="Borrar">×</button>`:''}<input type="hidden" id="${id}" ${f?`data-f="${f}"`:''} value="${esc(val||'')}"></div>`;
}
function intPicker(id,f,a,b,step,val,unit,ph){
  return `<div class="picker one" data-kind="int" data-target="${id}">${sel('v',unit||'valor',rng(a,b,step).map(i=>[i,`${i}${unit?' '+unit:''}`]),val===''||val==null?'':val,ph!=null?ph:null)}<input type="hidden" id="${id}" ${f?`data-f="${f}"`:''} value="${esc(val==null?'':val)}"></div>`;
}
function pickerValue(pk){
  const k=pk.dataset.kind,g=p=>{const s=pk.querySelector(`[data-part="${p}"]`);return s?s.value:'';};
  if(k==='int') return g('v');
  if(k==='dur'){const h=g('h'),m=g('m'),s=g('s');if(h===''&&m===''&&s==='')return '';const H=+h||0,M=+m||0,S=+s||0;if(!H&&!M&&!S)return '';return H?`${H}:${pad(M)}:${pad(S)}`:`${M}:${pad(S)}`;}
  if(k==='pace'){const m=g('m'),s=g('s');if(m===''&&s==='')return '';return `${+m||0}:${pad(+s||0)}`;}
  if(k==='dist'){const a=g('k'),d=g('d');if(a===''&&d==='')return '';const v=(+a||0)+(+d||0)/10;return v?String(v):'';}
  return '';
}
function onPickerChange(sl){
  const pk=sl.closest('.picker');if(!pk) return;
  // al elegir una parte, las vacías pasan a 0 para que el valor quede completo y visible
  if(sl.value!=='') pk.querySelectorAll('select').forEach(o=>{if(o!==sl&&o.value===''){const z=[...o.options].find(x=>x.value==='0');if(z)o.value='0';}});
  const hid=pk.querySelector('input[type=hidden]');hid.value=pickerValue(pk);
  pk.classList.toggle('set',hid.value!=='');
  hid.dispatchEvent(new Event('input',{bubbles:true}));
}
function clearPicker(btn){
  const pk=btn.closest('.picker');pk.querySelectorAll('select').forEach(o=>o.value='');
  const hid=pk.querySelector('input[type=hidden]');hid.value='';pk.classList.remove('set');
  hid.dispatchEvent(new Event('input',{bubbles:true}));
}
// compatibilidad: los campos de tiempo existentes pasan a ser ruedas
function timeField(id,f,val,kind,ph,label){
  return `<label>${label}</label>${pickerHTML(id,f,kind,val,true)}`;
}

function readDraftInputs(){
  if(!draft) return;

}
function validateStep(key){
  const d=draft,g=GOALS[d.goal];
  if(key==='when'&&g.dist){
    if(d.hasDate){
      if(!d.raceDate) return 'Elige el día de la carrera, o marca «Todavía no».';
      if(daysBetween(today(),d.raceDate)<14) return 'La carrera debe ser dentro de al menos 2 semanas.';
      if(daysBetween(today(),d.raceDate)>24*7) return 'Como mucho 24 semanas. Si es más tarde, empieza con un bloque de «Ponerme en forma».';
    }
    if(String(d.targetTime||'').trim()){const t=parseTime(d.targetTime);if(!t||t/g.dist<150||t/g.dist>720) return `Esa marca no parece correcta para ${g.name}. Escríbela como ${TARGET_PH[d.goal]}.`;}
  }
  if(key==='level'){
    const km=parseFloat(String(d.weeklyKm).replace(',','.'));
    if(isNaN(km)||km<0||km>200) return 'Indica los kilómetros semanales (0 si estás empezando).';
  }
  if(key==='marks'){
    for(let i=0;i<MARK_D.length;i++){const t=parseTime(d['mt'+i]);if(t){const pc=t/MARK_D[i][0];if(pc<150||pc>720) return `La marca de ${MARK_D[i][1].toLowerCase()} no parece correcta. Revísala.`;}}
  }
  if(key==='week'&&d.days.length<2) return 'Elige al menos 2 días.';
  if(key==='you'){
    if(String(d.hrMax||'').trim()&&!(+d.hrMax>120&&+d.hrMax<230)) return 'La FC máxima suele estar entre 120 y 230.';
    if(String(d.age||'').trim()&&!(+d.age>=10&&+d.age<=90)) return 'Revisa la edad.';
  }
  return null;
}
function profileFromDraft(){
  const d=draft,g=GOALS[d.goal];
  return {name:String(d.name||'').trim().slice(0,30),goal:d.goal,raceDate:g.dist&&d.hasDate&&d.raceDate?d.raceDate:null,weeks:+d.weeks||g.defWeeks,
    targetTime:g.dist&&String(d.targetTime||'').trim()?parseTime(d.targetTime):null,level:d.level,weeklyKm:parseFloat(String(d.weeklyKm).replace(',','.'))||0,
    marks:marksFromDraft(d),raceElev:g.dist?(+d.raceElev||0):0,maxMin:+d.maxMin||null,hills:d.hills!==false&&d.hills!=='0',
    days:[...d.days].sort((a,b)=>a-b),longDay:d.days.includes(+d.longDay)?+d.longDay:Math.max(...d.days),
    hrMax:+d.hrMax>120&&+d.hrMax<230?+d.hrMax:null,age:+d.age>=10&&+d.age<=90?+d.age:null};
}
function previewPlan(){
  const saved=JSON.stringify(state);
  try{
    createPlan(profileFromDraft(),!!state.profile);
    const pl=state.plan,cw=0;
    const first=state.sessions.filter(s=>s.status==='pending'&&s.date<=addDays(monday(today()),6)).map(s=>{const d=describe(s);return {date:s.date,title:d.title,len:['runwalk','fartlek','cuestas'].includes(s.type)?d.dur+' min':fk(s.km)+' km'};});
    const G=pl.goal,g=GOALS[state.profile.goal];
    let goalText='';
    if(g.dist){
      const now=raceTime(state.fitness.p,g.dist)*(1+elevPen(state.profile));
      goalText=G?`Hoy harías unos <b class="num">${ft(now)}</b> en ${g.name}${elevPen(state.profile)>0.005?' con ese desnivel':''}. Tu objetivo, <b class="num">${ft(state.profile.targetTime)}</b>, es <b>${G.status}</b>${G.status==='poco realista'?`: lo razonable sería unos ${ft(G.realistic)}`:''}.`:`Hoy harías unos <b class="num">${ft(now)}</b> en ${g.name}. El plan se adapta a cómo vayas mejorando.`;
    }
    return {weeks:pl.curve.length,km0:pl.curve[0].km,peak:Math.max(...pl.curve.map(c=>c.km)),first,goalText};
  }catch(e){return null;}
  finally{state=JSON.parse(saved);}
}

/* ---------- Avisos con «Deshacer» ---------- */
let toastTimer=null;
function toast(msg,opt){
  opt=opt||{};

  const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');
  t.innerHTML=`<span>${esc(msg)}</span>${opt.undo?'<button type="button" class="tbtn" data-act="undo">Deshacer</button>':''}`;
  if(opt.undo) t.dataset.snap=opt.undo;

function undoLast(btn){

let lastTab=null;
function route(){
  const h=(location.hash||'').slice(1);

  if(!state.profile){renderSetup();return;}
  if(wiz&&wiz.mode==='edit'){renderWizard();return;}
  tabs.hidden=false;
  const tab=['hoy','plan','progreso','perfil','zonas'].includes(h)?h:'hoy';
  const hl=tab==='zonas'?'progreso':tab;
  tabs.querySelectorAll('a').forEach(a=>{if(a.dataset.tab===hl)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  const changed=tab!==lastTab,y=window.scrollY;
  ({hoy:renderHoy,plan:renderPlan,progreso:renderProgreso,zonas:renderZonas,perfil:renderPerfil})[tab]();
  if(changed){window.scrollTo(0,0);app.classList.remove('view-in');void app.offsetWidth;app.classList.add('view-in');}
  else window.scrollTo(0,y);

let lockedY=null;
function lockScroll(){
  if(lockedY!==null) return;
  lockedY=window.scrollY;const b=document.body.style;
  b.position='fixed';b.top=`-${lockedY}px`;b.left='0';b.right='0';b.width='100%';
}
function unlockScroll(){
  if(lockedY===null) return;
  const y=lockedY;lockedY=null;const b=document.body.style;
  b.position='';b.top='';b.left='';b.right='';b.width='';
  window.scrollTo(0,y);
}
function closeSheet(instant){
  const bg=layer.querySelector('.sheet-bg');if(!bg) return;
  unlockScroll();
  if(instant||matchMedia('(prefers-reduced-motion: reduce)').matches){bg.remove();return;}
  bg.classList.add('closing');setTimeout(()=>bg.remove(),200);
}
function openSheet(html){
  const old=layer.querySelector('.sheet-bg');if(old)old.remove();
  const tt=layer.querySelector('.toast');if(tt)tt.remove();
  const bg=document.createElement('div');bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div>${html}</div>`;
  bg.addEventListener('click',e=>{if(e.target===bg)closeSheet();});
  const sh=bg.querySelector('.sheet');
  let y0=null,dy=0;
  sh.addEventListener('touchstart',e=>{if(sh.scrollTop<=0){y0=e.touches[0].clientY;dy=0;sh.style.transition='none';}},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){sh.style.transform=`translateY(${dy}px)`;}else{y0=null;sh.style.transform='';}},{passive:true});
  sh.addEventListener('touchend',()=>{if(y0==null)return;sh.style.transition='';if(dy>110){sh.style.transform=`translateY(100%)`;closeSheet();}else sh.style.transform='';y0=null;});
  layer.appendChild(bg);
  lockScroll();
}

/* ---------- Registrar una sesión ---------- */
const RPE_OPTS=[[2,'Muy fácil'],[4,'Fácil'],[6,'Normal'],[8,'Duro'],[10,'Al límite']];
function openLog(id){
  const s=state.sessions.find(x=>x.id===id);if(!s)return;const d=describe(s);
  const q=['series','tempo','ritmo','fartlek'].includes(s.type)&&d.pf;
  openSheet(`<div id="logf" class="stack" data-id="${s.id}">
    <span class="eyebrow">${fdLong(s.date)}</span><h2>${d.title}</h2>
    ${stravaOn()?`<div class="note small">¿La grabaste con el reloj? <button type="button" class="linkb" data-act="syncclose">Sincroniza Strava</button> y se registra sola, con todos los datos.</div>`:''}
    <div><label>¿Cómo te ha resultado?</label><div class="rpe" role="radiogroup">${RPE_OPTS.map(([v,l])=>`<button type="button" role="radio" data-act="rpe" data-v="${v}" aria-checked="false"><b>${v}</b>${l}</button>`).join('')}</div><div class="hint">Lo previsto era ${d.rpe} de 10. Es el dato que más uso para adaptar el plan.</div></div>
    <div><label>Distancia <span class="muted">(prevista: ${s.type==='test'?'5':fk(s.km)} km)</span></label>${pickerHTML('l-km','','dist','',true)}</div>
    <div>${timeField('l-t','',null,'dur','',s.type==='test'?'Tiempo de los 5 km':'Tiempo total')}</div>
    ${s.type==='test'?'<div class="hint" style="margin-top:-6px">En el test, pon solo los 5 km cronometrados.</div>':''}
    ${q?`<div>${timeField('l-wp','',null,'pace',`${fp(d.lo)}`,'Ritmo en la parte rápida <span class="muted">(opcional)</span>','enterkeyhint="next"')}<div class="hint">Objetivo ${paceR(d.lo,d.hi)} /km. Con este dato afino tus ritmos.</div></div>`:''}
    <div><label for="l-n">Notas <span class="muted">(opcional)</span></label><textarea id="l-n" rows="2" placeholder="Molestias, calor, cansancio…"></textarea></div>
    <p class="err" id="lerr" role="alert"></p>
    <div class="grid2"><button type="button" class="ghost" data-act="close">Cancelar</button><button type="button" class="primary" data-act="logsave">Guardar</button></div>
  </div>`);
}
function submitLog(form){
  const s=state.sessions.find(x=>x.id===form.dataset.id);if(!s)return;
  const sel=form.querySelector('.rpe [aria-checked="true"]');
  const err=form.querySelector('#lerr');
  if(!sel){err.textContent='Elige cómo te ha resultado.';form.querySelector('.rpe').classList.add('shake');setTimeout(()=>form.querySelector('.rpe')?.classList.remove('shake'),400);return;}
  const kmRaw=form.querySelector('#l-km').value.trim().replace(',','.');
  const km=kmRaw?parseFloat(kmRaw):null;
  const tRaw=form.querySelector('#l-t').value.trim(),time=parseTime(tRaw);
  if(kmRaw&&(isNaN(km)||km<=0||km>100)){err.textContent='Revisa la distancia, por ejemplo 8,5.';return;}
  if(tRaw&&!time){err.textContent='Revisa el tiempo.';return;}
  if(km&&time&&(time/km<150||time/km>1100)){err.textContent='La distancia y el tiempo no cuadran. Revisa ambos.';return;}
  if(s.type==='test'&&!time){err.textContent='Para el test necesito el tiempo de los 5 km.';return;}
  const wpEl=form.querySelector('#l-wp');const wp=wpEl&&wpEl.value.trim()?parsePace(wpEl.value):null;
  if(wpEl&&wpEl.value.trim()&&!wp){err.textContent='Revisa el ritmo, por ejemplo 4:45.';return;}
  const snap=JSON.stringify(state),ev0=state.adapt.events[0];
  logDone(s,{rpe:+sel.dataset.v,km:km||(s.type==='test'&&time?5:null),time,workPace:wp,notes:form.querySelector('#l-n').value.trim().slice(0,200)});
  save();closeSheet();route();
  const ne=state.adapt.events[0];
  toast(ne&&ne!==ev0?'Guardada. Plan ajustado: '+ne.text.split('. ')[0]+'.':'Guardada. ¡Bien hecho!',{undo:snap});
}
function askSkip(id){
  const s=state.sessions.find(x=>x.id===id);if(!s)return;
  openSheet(`<div class="stack"><h2>¿No puedes hacerla?</h2><p class="muted">${KEY_TYPES.includes(s.type)?'Es una sesión importante: intentaré moverla a otro día libre de esta semana con descanso suficiente.':'Es un rodaje suave: lo quito sin más.'} Si se repite a menudo, bajaré la carga del plan.</p>
    ${moveOptions(s).length>1?'<p class="small muted">Si solo quieres cambiarla de día, usa «Cambiar de día» en la sesión.</p>':''}
    <div class="grid2"><button class="ghost" data-act="close">Volver</button><button class="primary" data-act="skipYes" data-id="${s.id}">No puedo</button></div></div>`);
}
function confirmReset(){
  openSheet(`<div class="stack"><h2>¿Borrar todo?</h2><p class="muted">Se borran el plan, el historial y la conexión con Strava de este móvil. Si no tienes una copia, no se puede recuperar.</p>
    <div class="grid2"><button class="ghost" data-act="close">Cancelar</button><button class="primary" data-act="resetYes">Borrar todo</button></div></div>`);
}
function setBusy(on){
  document.querySelectorAll('[data-act=sync]').forEach(b=>{if(!b.dataset.label)b.dataset.label=b.textContent;b.disabled=on;b.classList.toggle('busy',on);b.textContent=on?'Sincronizando…':b.dataset.label;});
}

/* ---------- Eventos ---------- */
let lastAct={a:null,t:0};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  const hit=e.target.closest('.hit');
  if(hit){const tip=hit.closest('.chart').querySelector('.tip');tip.textContent=hit.dataset.tip;}
  if(!t||t.disabled)return;
  const a=t.dataset.act,id=t.dataset.id;
  // un doble toque rápido no debe ejecutar dos veces la acción (p. ej. saltarse un paso)
  const now=Date.now();
  if(a!=='rpe'&&a!=='wday'&&a===lastAct.a&&now-lastAct.t<450) return;
  lastAct={a,t:now};
  switch(a){
    // asistente
    case 'wset':{readDraftInputs();const f=t.dataset.f,v=t.dataset.v;
      if(f==='hasDate') draft.hasDate=v==='1';
      else if(f==='hills') draft.hills=v==='1';
      else{draft[f]=v;if(f==='goal'){draft.weeks=GOALS[v].defWeeks;if(!GOALS[v].dist)draft.targetTime='';}if(f==='weeks')draft.weeks=+v;if(f==='longDay')draft.longDay=+v;if(f==='raceElev'||/^ma\d$/.test(f))draft[f]=+v;}
      wizRerender();if(f==='refDist'&&v){const i=$('#f-rt');if(i)i.focus();}break;}
    case 'wday':{readDraftInputs();const v=+t.dataset.v,i=draft.days.indexOf(v);if(i>=0)draft.days.splice(i,1);else draft.days.push(v);
      if(!draft.days.includes(+draft.longDay)&&draft.days.length)draft.longDay=Math.max(...draft.days);wizRerender();break;}
    case 'kmstep_unused':{readDraftInputs();const v=Math.max(0,Math.min(200,Math.round((parseFloat(String(draft.weeklyKm).replace(',','.'))||0)+ +t.dataset.v)));draft.weeklyKm=v;$('#f-km').value=v;break;}
    case 'wnext': wizNext();break;
    case 'wback': wizBack();break;
    case 'wgo':{readDraftInputs();const st=wizSteps();wiz.i=st.indexOf(t.dataset.step);wiz.dir=-1;wiz.anim=true;renderWizard();window.scrollTo(0,0);break;}
    case 'wedit': draft=draftFromProfile(state.profile);wiz={mode:'edit',key:t.dataset.step,i:0,dir:1,anim:true};renderWizard();window.scrollTo(0,0);break;
    case 'wsave': wizSave();break;
    case 'wconfirm': wizConfirm();break;
    // sesiones
    case 'open': openSession(id);break;
    case 'log': openLog(id);break;
    case 'logsave': submitLog($('#logf'));break;
    case 'syncclose': closeSheet();doSync(true);break;
    case 'skip': askSkip(id);break;
    case 'skipYes':{const s=state.sessions.find(x=>x.id===id);if(!s)break;const snap=JSON.stringify(state),ev0=state.adapt.events[0];skip(s,false);save();closeSheet();route();const ne=state.adapt.events[0];toast(ne&&ne!==ev0?ne.text:'Sesión quitada del plan.',{undo:snap});break;}
    case 'close': closeSheet();break;
    case 'move':{const s=state.sessions.find(x=>x.id===id);if(!s)break;const snap=JSON.stringify(state);const msg=moveSession(s,t.dataset.d);if(msg){save();closeSheet();route();toast(msg,{undo:snap});}break;}
    case 'pause': openPause();break;
    case 'preason': t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));break;
    case 'pausego':{const f=$('#pausef');const r=f.querySelector('[data-act=preason][aria-pressed=true]').dataset.v;const to=f.querySelector('#p-to').value||null;const snap=JSON.stringify(state);startPause(r,to);save();closeSheet();lastTab=null;location.hash='#hoy';route();toast('Plan en pausa. Recupérate bien.',{undo:snap});break;}
    case 'resume':{const snap=JSON.stringify(state);resumePlan();save();closeSheet();route();toast('Plan retomado con la carga ajustada.',{undo:snap});break;}
    case 'sumok': state.adapt.summarySeen=monday(today());save();route();break;
    case 'rpe': t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-checked',String(b===t)));$('#lerr').textContent='';break;
    case 'rate':{const s=state.sessions.find(x=>x.id===id);const snap=JSON.stringify(state),ev0=state.adapt.events[0];rateSession(s,+t.dataset.v);save();route();const ne=state.adapt.events[0];toast(ne&&ne!==ev0?'Gracias. Plan ajustado: '+ne.text.split('. ')[0]+'.':'Gracias, anotado.',{undo:snap});break;}
    case 'undo': undoLast(t);break;
    case 'pclear': clearPicker(t);break;
    case 'addrun': openAddRun();break;
    case 'addset': readAddRun();addDraft[t.dataset.f]=t.dataset.v;renderAddRun();break;
    case 'addrpe': addDraft.rpe=+t.dataset.v;t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-checked',String(b===t)));$('#aerr').textContent='';break;
    case 'addsave': saveAddRun();break;
    case 'manopen': openManual(id);break;
    case 'mandel':{const snap=JSON.stringify(state);state.manual=(state.manual||[]).filter(m=>m.id!==id);save();closeSheet();route();toast('Entreno borrado.',{undo:snap});break;}
    case 'unlog':{const s=state.sessions.find(x=>x.id===id);if(!s)break;const snap=JSON.stringify(state);unlogSession(s);save();closeSheet();route();toast('Registro borrado.',{undo:snap});break;}
    case 'newblock':{const snap=JSON.stringify(state);const pr={...state.profile};pr.weeklyKm=Math.round(activities().filter(a=>daysBetween(a.date,today())<21&&a.date<=today()).reduce((x,a)=>x+a.km,0)/3);if(pr.raceDate&&pr.raceDate<=today()){pr.raceDate=null;pr.targetTime=null;}pr.refDist=null;pr.refTime=null;state.profile.refDist=null;state.profile.refTime=null;createPlan(pr,true);save();route();toast('Nuevo bloque creado.',{undo:snap});break;}
    // datos y Strava
    case 'export':{const blob=new Blob([JSON.stringify(state)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download=`zancada-${today()}.json`;document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(l.href);l.remove();},1500);toast('Copia descargada. En el iPhone queda en la app Archivos.');break;}
    case 'importOpen': $('#f-file').click();break;
    case 'connect': readDraftInputs();stravaConnect();break;
    case 'sync': doSync(true);break;
    case 'disconnect':{const snap=JSON.stringify(state);const s=sv();s.tokens=null;save();route();toast('Strava desconectado. Para retirar el permiso del todo: Strava › Ajustes › Mis aplicaciones.',{undo:snap});break;}
    case 'pastecode':{let c=($('#sv-code').value||'').trim();const m=c.match(/[?&]code=([^&]+)/);if(m)c=decodeURIComponent(m[1]);if(!c){toast('Pega primero el código.');break;}
      if(!sv().clientId||!sv().clientSecret){toast('Escribe también el Client ID y el Client Secret.');break;}
      stravaExchange(c).then(()=>{toast('Strava conectado. Importando carreras…');return doSync(false);}).catch(e=>toast(e.message));break;}
    case 'copycode':{const c=$('#thecode').textContent;(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>toast('Código copiado.')).catch(()=>toast('Mantén pulsado el código para copiarlo.'));break;}
    case 'resetAsk': confirmReset();break;
    case 'resetYes': state=blankState();draft=null;wiz=null;save();closeSheet(true);location.hash='';lastTab=null;route();break;
  }
});
document.addEventListener('pointerover',e=>{const hit=e.target.closest&&e.target.closest('.hit');if(hit){hit.closest('.chart').querySelector('.tip').textContent=hit.dataset.tip;}});
// formato de tiempo al escribir + borrador del asistente
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.time){const v=fmtDigits(el.value,el.dataset.time);if(v!==el.value)el.value=v;}
  if(el.dataset&&el.dataset.f&&draft&&el.closest('.wiz')){
    readDraftInputs();
    const h=$('#goalhint');if(h)h.innerHTML=goalHint(draft);
    const mh=$('#markhint');if(mh)mh.innerHTML=markHint(draft);
    if(/^mt\d$/.test(el.dataset.f)&&(!!el.value)!==(!!el.closest('.mark').querySelector('.seg'))){wizRerender();return;}
    const ah=$('#agehint');if(ah)ah.textContent=(ageNote({age:+draft.age})||(draft.age?'Con tu edad el plan sigue la progresión normal.':''))+(!draft.hrMax&&draft.age&&!(state.strava&&state.strava.hrMax)?` FC máxima estimada: ${Math.round(208-0.7*draft.age)} ppm.`:'');
    const e2=$('#err');if(e2)e2.textContent='';
  }
  const k=el.dataset&&el.dataset.sv;if(k){sv()[k]=el.value.trim();save();}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches&&el.matches('.picker select')){onPickerChange(el);return;}
  if(el.id==='f-race'&&draft){readDraftInputs();wizRerender();return;}
  if(el.id==='a-date'&&addDraft){readAddRun();renderAddRun();return;}
  if(el.id==='p-to'){const h=$('#p-to-h');if(h)h.textContent=el.value?`Vuelves el ${fdLong(el.value)}.`:'';return;}
  if(el.id!=='f-file'||!el.files[0])return;
  const fr=new FileReader();fr.onload=()=>{try{const s=JSON.parse(fr.result);if(!s.profile||!s.sessions)throw 0;const snap=JSON.stringify(state);state=s;draft=null;save();lastTab=null;location.hash='#hoy';route();toast('Copia restaurada.',{undo:snap});}catch(_){toast('Ese archivo no es una copia válida de Zancada.');}};fr.readAsText(el.files[0]);
});
// Intro nunca envía nada: pasa al siguiente campo o cierra el teclado
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSheet();return;}
  if(e.key!=='Enter'||e.target.tagName!=='INPUT') return;
  e.preventDefault();
  const scope=e.target.closest('.sheet,.wiz,main')||document;
  const ins=[...scope.querySelectorAll('input:not([type=hidden]):not([type=file]):not([disabled])')];
  const nx=ins[ins.indexOf(e.target)+1];
  if(nx&&e.target.getAttribute('enterkeyhint')==='next') nx.focus(); else e.target.blur();
});
document.addEventListener('submit',e=>e.preventDefault());
// al volver a la app: si ha cambiado el día, se actualiza el plan; si hace rato de la última sincronización, se sincroniza
let shownDay=null;
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||!state) return;
  if(stravaOn()&&Date.now()-sv().lastSync>20*60000){doSync(false);shownDay=today();return;}
  if(shownDay&&shownDay!==today()&&state.profile&&state.plan){if(processMissed())save();route();}
  shownDay=today();
});

/* =========================================================
   Arranque
   ========================================================= */
function boot(){
  if(!state){try{state=JSON.parse(localStorage.getItem(LS))||blankState();}catch(e){state=blankState();}}
  shownDay=today();
  closeSheet();
  const qp=new URLSearchParams(location.search);
  if(qp.get('state')==='zancada'&&(qp.has('code')||qp.has('error'))){
    history.replaceState(null,'',location.pathname+location.hash);
    if(qp.get('error')){toast('Has cancelado la conexión con Strava.');}
    else if(!(state.strava&&state.strava.clientSecret)){renderCodeScreen(qp.get('code'));return;}
    else{route();stravaExchange(qp.get('code'),qp.get('scope')).then(()=>{toast('Strava conectado. Importando carreras…');return doSync(false);}).catch(e=>{toast(e.message);route();});return;}
  }
  if(stravaOn()&&Date.now()-sv().lastSync>20*60000){route();doSync(false);return;}
  if(state.profile&&state.plan){if(processMissed())save();}
  route();
}
if(typeof window!=='undefined'&&!window.__TEST__){
  boot();
  if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
}
